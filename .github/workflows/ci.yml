name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx commitlint --from=${{ github.event.pull_request.base.sha || 'HEAD~1' }} --to=HEAD
      - run: npm run format:check
      - run: npm run db:generate
        env:
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          STATS_PIN: ci-placeholder
